<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="cache-control" content="no-store, must-revalidate">
<meta http-equiv="expires" content="0">
<title>OpenDrone hero studio</title>
<style>
  :root{--bg:#0a0c0f;--panel:#14181d;--line:#242b33;--ink:#e9e7e2;--dim:#8e98a3;--gold:#d8a13a}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden}
  canvas{display:block}
  #ui{position:fixed;top:0;right:0;width:320px;height:100%;background:var(--panel);
    border-left:1px solid var(--line);overflow-y:auto;padding:14px 14px 40px;box-sizing:border-box}
  details{border-bottom:1px solid var(--line);margin:0}
  details[open]{padding-bottom:8px}
  summary{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
    font-weight:600;padding:9px 0;cursor:pointer;list-style:none;user-select:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:'+ ';color:var(--dim)}
  details[open]>summary::before{content:'- '}
  .grp{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin:8px 0 2px}
  .row{display:flex;align-items:center;gap:8px;margin:4px 0}
  .row label{flex:0 0 82px;color:var(--dim);font-size:11px}
  .row input[type=range]{flex:1;min-width:0;accent-color:var(--gold)}
  .row .val{flex:0 0 36px;text-align:right;font-variant-numeric:tabular-nums;font-size:11px}
  .row input[type=color]{width:32px;height:20px;border:1px solid var(--line);background:none;padding:0}
  .row input[type=text]{flex:1;min-width:0;background:#1b2027;color:var(--ink);border:1px solid var(--line);
    border-radius:4px;padding:3px 6px;font:inherit}
  .row input[type=checkbox]{flex:0 0 auto;margin:0;accent-color:var(--gold)}
  .row input[type=range]:disabled{opacity:.35}
  select,button{background:#1b2027;color:var(--ink);border:1px solid var(--line);
    border-radius:4px;padding:5px 8px;font:inherit;cursor:pointer}
  select{width:100%}
  button:hover{border-color:var(--gold)}
  button.on{background:var(--gold);color:#111;border-color:var(--gold)}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  #stage{position:fixed;left:20px;bottom:18px;z-index:5;color:var(--dim);max-width:42ch}
  #stage b{color:var(--ink);font-size:18px;display:block;font-weight:600}
  #stage i{font-style:normal;color:var(--gold);font-size:11px}
  #stage .cap{display:block;color:var(--dim);font-size:12px;margin-top:4px}
  #load{position:fixed;left:20px;top:18px;z-index:5;color:var(--dim)}
  #bar{width:190px;height:2px;background:#222;margin-top:6px}
  /* Complétion du CSS tronqué */
  #bar>i{display:block;height:100%;width:0;background:var(--gold);transition: width 0.2s ease-out;}
</style>
</head>
<body>

<div id="load">Chargement du modèle...<div id="bar"><i id="progress"></i></div></div>
<div id="stage">
  <b id="stage-title">OpenDrone 3"</b>
  <span id="stage-note" class="cap">Initialisation...</span>
</div>

<div id="ui">
  <!-- Le panneau d'édition sera généré ici -->
  <details open>
    <summary>Caméra & Environnement</summary>
    <div class="row"><button id="save-btn" style="width:100%; border-color:var(--gold);">Sauvegarder (_studio.json)</button></div>
  </details>
</div>

<!-- Import maps pour Three.js -->
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  let scene, camera, renderer, config, model;

  async function init() {
    // 1. Initialisation de la scène WebGL
    scene = new THREE.Scene();
    
    camera = new THREE.PerspectiveCamera(45, (window.innerWidth - 320) / window.innerHeight, 0.1, 100);
    
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth - 320, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 2. Chargement de la configuration JSON
    try {
      const configRes = await fetch('config.json'); // Remplacer par le bon chemin
      config = await configRes.json();
      
      // Application des paramètres globaux
      scene.background = new THREE.Color(config.lighting.background);
      renderer.toneMappingExposure = config.lighting.exposure;
      camera.position.set(0, config.camera.height, config.camera.distance);
      
      document.getElementById('stage-title').innerText = config.name;
      
      setupLighting(config);
      loadModel(config);
      
    } catch (e) {
      console.error("Erreur lors du chargement de la config:", e);
    }

    // Boucle de rendu
    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  }

  function setupLighting(cfg) {
    const ambient = new THREE.AmbientLight(0xffffff, cfg.lighting.ambient);
    scene.add(ambient);

    // Lumière principale (Key)
    const keyLight = new THREE.DirectionalLight(cfg.lighting.key.colour, cfg.lighting.key.power);
    // Calcul de la position via azimut et élévation (à convertir en radians)
    const phi = THREE.MathUtils.degToRad(90 - cfg.lighting.key.elevation);
    const theta = THREE.MathUtils.degToRad(cfg.lighting.key.azimuth);
    keyLight.position.setFromSphericalCoords(10, phi, theta);
    scene.add(keyLight);

    // Spotlight principal
    const spot = new THREE.SpotLight(cfg.spotlight.colour, cfg.spotlight.power);
    spot.angle = THREE.MathUtils.degToRad(cfg.spotlight.coneAngle);
    spot.penumbra = cfg.spotlight.softness;
    spot.position.set(0, cfg.spotlight.height, 0);
    scene.add(spot);
  }

  function loadModel(cfg) {
    const loader = new GLTFLoader();
    
    loader.load(
      cfg.model,
      (gltf) => {
        model = gltf.scene;
        
        // 3. Application dynamique des matériaux (Regex)
        model.traverse((child) => {
          if (child.isMesh) {
            applyMaterialConfig(child, cfg.materials);
          }
        });

        scene.add(model);
        document.getElementById('load').style.display = 'none';
        document.getElementById('stage-note').innerText = cfg.beats[0].note;
      },
      (xhr) => {
        const progress = (xhr.loaded / xhr.total) * 100;
        document.getElementById('progress').style.width = progress + '%';
      },
      (error) => console.error("Erreur GLTF:", error)
    );
  }

  function applyMaterialConfig(mesh, materialsConfig) {
    // Nettoyage du nom comme indiqué dans le JSON (_note)
    const nodeName = mesh.name.replace(/_[0-9]+$/, '').replace(/_/g, ' ');

    // Recherche de la première correspondance Regex
    for (const matCfg of materialsConfig) {
      if (!matCfg.match) continue; // Skip catch-all pour le moment
      
      const regex = new RegExp(matCfg.match);
      if (regex.test(nodeName)) {
        if (matCfg.tint) {
            mesh.material.color.set(matCfg.tint);
        }
        mesh.material.metalness = matCfg.metalness;
        mesh.material.roughness = matCfg.roughness;
        // L'environnement (env) et la saturation (sat) nécessitent un traitement spécifique des shaders ou de l'envMap
        mesh.material.needsUpdate = true;
        return;
      }
    }
  }

  window.addEventListener('resize', () => {
    camera.aspect = (window.innerWidth - 320) / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth - 320, window.innerHeight);
  });

  init();
</script>
</body>
</html>
