<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenDrone - Configurateur 3D Complet</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0b0f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }
        .tab-btn {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .tab-btn:hover, .tab-btn.active {
            background-color: #ffb700;
            color: #000;
            border-color: #ffb700;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 1.1rem;
            pointer-events: none;
            letter-spacing: 0.5px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <button class="tab-btn active" onclick="loadCompleteDrone('3')">3" Freestyle</button>
        <button class="tab-btn" onclick="loadCompleteDrone('5')">5" Freestyle</button>
    </div>

    <div id="loading">Chargement de l'assemblage complet...</div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

        const container = document.getElementById('canvas-container');
        const loadingElement = document.getElementById('loading');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0f);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 60, 120);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.4;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.05;

        // Éclairage studio
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 3.0);
        dirLight.position.set(40, 90, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const blueFill = new THREE.DirectionalLight(0x88bbff, 1.2);
        blueFill.position.set(-50, 30, -50);
        scene.add(blueFill);

        const loader = new GLTFLoader();
        loader.setMeshoptDecoder(MeshoptDecoder);

        let droneGroup = new THREE.Group();
        scene.add(droneGroup);

        window.loadCompleteDrone = function(sizeType) {
            loadingElement.style.display = 'block';
            loadingElement.innerText = "Chargement des pièces et composants...";

            while(droneGroup.children.length > 0){ 
                droneGroup.remove(droneGroup.children[0]); 
            }

            const partsToLoad = [
                `models/frame${sizeType}.glb`,
                `models/motors${sizeType}.glb`,
                `models/stack.glb`,
                `models/vtx.glb`
            ];

            let loadedCount = 0;
            const masterGroup = new THREE.Group();

            partsToLoad.forEach((path) => {
                loader.load(
                    path,
                    (gltf) => {
                        const part = gltf.scene;
                        
                        part.traverse((child) => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                                if (child.material) {
                                    child.material.roughness = 0.3;
                                    child.material.metalness = 0.8;
                                }
                            }
                        });

                        masterGroup.add(part);
                        loadedCount++;

                        if (loadedCount === partsToLoad.length) {
                            const box = new THREE.Box3().setFromObject(masterGroup);
                            const center = box.getCenter(new THREE.Vector3());
                            masterGroup.position.sub(center);

                            droneGroup.add(masterGroup);
                            loadingElement.style.display = 'none';
                        }
                    },
                    undefined,
                    (error) => {
                        console.warn(`Fichier ignoré ou introuvable : ${path}`);
                        loadedCount++;
                        if (loadedCount === partsToLoad.length) {
                            const box = new THREE.Box3().setFromObject(masterGroup);
                            const center = box.getCenter(new THREE.Vector3());
                            masterGroup.position.sub(center);
                            droneGroup.add(masterGroup);
                            loadingElement.style.display = 'none';
                        }
                    }
                );
            });
        };

        loadCompleteDrone('3');

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
            });
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
