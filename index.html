<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>OpenDrone | Interface Réorganisée</title>
  <style>
    :root {
      --bg: #090a0d;
      --bg-surface: rgba(16, 20, 26, 0.85);
      --bg-panel: rgba(18, 23, 30, 0.95);
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(216, 161, 58, 0.5);
      --gold: #ffb700;
      --text: #f0f2f5;
      --text-muted: #8b95a5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: sans-serif; overflow: hidden; }
    
    #canvas-container { position: absolute; inset: 0; z-index: 1; }

    header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 24px; pointer-events: none;
    }
    .brand { pointer-events: auto; font-weight: 800; color: var(--gold); }
    .top-controls { display: flex; align-items: center; gap: 10px; pointer-events: auto; }

    .btn-pill {
      padding: 8px 14px; border-radius: 8px; background: var(--bg-surface);
      border: 1px solid var(--border); color: var(--text-muted); cursor: pointer;
      font-size: 11px; font-weight: 600; text-transform: uppercase; transition: all 0.2s;
    }
    .btn-pill:hover { border-color: var(--border-focus); color: var(--text); }
    .btn-pill.active { border-color: var(--gold); color: var(--gold); }

    /* Panneau HUD bas-droite */
    .hud-right {
      position: absolute; bottom: 24px; right: 24px; z-index: 10;
      background: var(--bg-panel); border: 1px solid var(--border);
      padding: 16px; border-radius: 12px; backdrop-filter: blur(20px);
      width: 250px; pointer-events: auto;
    }
    .slider-row { display: flex; align-items: center; gap: 10px; }
    .slider-row label { font-size: 11px; color: var(--text-muted); flex: 1; }
    input[type=range] { accent-color: var(--gold); }

    /* Dropdowns */
    .dropdown { position: relative; }
    .menu-panel {
      position: absolute; top: calc(100% + 8px); right: 0;
      background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px; display: none; width: 200px;
    }
    .menu-panel.open { display: block; }
    .menu-item { padding: 8px; cursor: pointer; color: var(--text-muted); font-size: 12px; }
    .menu-item:hover { color: var(--gold); }
  </style>
</head>
<body>
  <header>
    <div class="brand">OpenDrone</div>
    <div class="top-controls">
      <!-- Menu Assemblage -->
      <div class="dropdown">
        <button class="btn-pill" id="btn-menu-assemblage">Assemblage</button>
        <div class="menu-panel" id="panel-assemblage">
          <div class="menu-item" id="act-flatlay">Mise à plat</div>
          <div class="menu-item" id="act-step">Mode Pièce par Pièce</div>
        </div>
      </div>
      <!-- Menu Studio -->
      <div class="dropdown">
        <button class="btn-pill" id="btn-menu-studio">Studio</button>
        <div class="menu-panel" id="panel-studio">
          <div class="menu-item">Rendu PBR</div>
          <div class="menu-item">Éclairage</div>
        </div>
      </div>
    </div>
  </header>

  <div id="canvas-container"></div>

  <!-- HUD Bas à droite -->
  <div class="hud-right">
    <div class="slider-row">
      <label>Éclatement</label>
      <input type="range" id="slider-explode" min="0" max="1" step="0.01" value="0">
    </div>
  </div>

  <script>
    // Logique de toggle pour les menus
    const toggles = {
      'btn-menu-assemblage': 'panel-assemblage',
      'btn-menu-studio': 'panel-studio'
    };
    Object.entries(toggles).forEach(([btnId, panelId]) => {
      document.getElementById(btnId).addEventListener('click', (e) => {
        e.stopPropagation();
        document.getElementById(panelId).classList.toggle('open');
      });
    });
    window.addEventListener('click', () => {
      document.querySelectorAll('.menu-panel').forEach(p => p.classList.remove('open'));
    });
  </script>
</body>
</html>
