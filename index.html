<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TinyHoop MK1 — Build FPV</title>
  
  <!-- CSS Intégré de secours pour éviter l'affichage en HTML brut si le fichier externe manque -->
  <style>
    :root {
      --bg: #0a0e14;
      --panel-bg: #121820;
      --border: #222d3d;
      --text: #e9eef5;
      --text-muted: #8b95a5;
      --accent: #ffb700;
    }
    body {
      margin: 0; padding: 0; background-color: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, sans-serif; overflow: hidden; height: 100vh;
      display: flex; flex-direction: column;
    }
    header {
      background: var(--panel-bg); border-bottom: 1px solid var(--border);
      padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; z-index: 10;
    }
    header h1 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 8px; }
    header h1 small { color: var(--text-muted); font-weight: normal; }
    .build-stamp { font-size: 11px; background: rgba(255,183,0,0.1); color: var(--accent); padding: 2px 6px; border-radius: 4px; }
    .tabs { display: flex; gap: 6px; align-items: center; margin-left: auto; flex-wrap: wrap; }
    button, .menu-btn {
      background: #1a222d; border: 1px solid var(--border); color: var(--text);
      padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.2s;
    }
    button:hover, .menu-btn:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); color: #0a0e14; font-weight: 600; border: none; }
    .nav-sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }
    
    #layout { display: flex; flex: 1; position: relative; overflow: hidden; }
    #sidebar { width: 280px; background: var(--panel-bg); border-right: 1px solid var(--border); overflow-y: auto; padding: 12px; }
    #stage { flex: 1; position: relative; background: #070a0f; }
    .pane { position: absolute; inset: 0; display: flex; flex-direction: column; }
    .pane.hidden { display: none; }
    #viewport { width: 100%; height: 100%; outline: none; }

    /* Cube de navigation CAO */
    #navcube {
      position: absolute; top: 16px; right: 16px; width: 110px; height: 110px;
      z-index: 20; cursor: pointer; background: transparent; pointer-events: auto;
    }
    #navcube-canvas { width: 100%; height: 100%; border-radius: 8px; display: block; }

    .view-btns { position: absolute; bottom: 16px; left: 16px; display: flex; gap: 6px; z-index: 10; }
    .hist-btns { position: absolute; bottom: 16px; right: 16px; display: flex; gap: 6px; z-index: 10; }
    .tip { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--text-muted); pointer-events: none; margin: 0; }
    
    /* Menus déroulants simples */
    .menu { position: relative; display: inline-block; }
    .menu-pop { display: none; position: absolute; right: 0; top: calc(100% + 6px); background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; width: 280px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 50; }
    .menu.open .menu-pop { display: block; }
    .opt { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 8px; cursor: pointer; }
    .hint { font-size: 11px; color: var(--text-muted); line-height: 1.4; margin-top: 6px; }
  </style>

  <!-- Importmap pour Three.js -->
  <script type="importmap">{
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/"
    }
  }</script>
</head>
<body>
<header>
  <h1>TinyHoop&nbsp;MK1 <small>— visualisation du build FPV</small>
    <span id="build-stamp" class="build-stamp" title="Version du code chargée par le navigateur">v2.1-fix</span>
  </h1>
  <nav class="tabs">
    <button id="side-toggle" title="Replier / déplier le panneau">⇤ Panneau</button>
    <button id="asm-assemble-chassis" class="primary" title="Monter le build">▶ Assembler</button>
    <button id="asm-disassemble" title="Ramener les pièces à leur rangement">◀ Désassembler</button>
    <span class="nav-sep"></span>
    
    <div class="menu" data-menu="affichage">
      <button class="menu-btn" type="button" aria-expanded="false">Affichage</button>
      <div class="menu-pop">
        <label class="opt"><input type="checkbox" id="opt-edges" checked> Arêtes surlignées</label>
        <label class="opt"><input type="checkbox" id="opt-grid" checked> Grille au sol</label>
        <label class="opt"><input type="checkbox" id="opt-rotate"> Rotation auto</label>
      </div>
    </div>
    
    <span class="nav-sep"></span>
    <button class="tab on" data-tab="3d">Vue 3D</button>
  </nav>
</header>

<main id="layout">
  <aside id="sidebar">
    <section class="fold">
      <h2>Pièces modélisées</h2>
      <ul id="part-list"></ul>
    </section>
  </aside>
  
  <div id="stage">
    <!-- Vue 3D -->
    <div id="pane-3d" class="pane">
      <div id="viewport"></div>
      
      <!-- Cube de navigation interactif -->
      <div id="navcube" title="Glisse pour orbiter · clique une face pour orienter la vue">
        <canvas id="navcube-canvas"></canvas>
      </div>
      
      <div class="view-btns">
        <button data-view="iso" class="on">ISO</button>
        <button data-view="top">Dessus</button>
        <button data-view="front">Avant</button>
        <button data-view="side">Côté</button>
      </div>
      
      <p class="tip">Clic gauche : orbite · molette : zoom · clic droit : déplacer</p>
    </div>
  </div>
</main>

<!-- Script principal et gestionnaire du NavCube -->
<script type="module">
  import * as THREE from 'three';

  // Gestion basique des menus déroulants
  document.querySelectorAll('.menu-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const menu = btn.closest('.menu');
      document.querySelectorAll('.menu').forEach(m => { if (m !== menu) m.classList.remove('open'); });
      menu.classList.toggle('open');
    });
  });
  window.addEventListener('click', () => {
    document.querySelectorAll('.menu').forEach(m => m.classList.remove('open'));
  });

  // Initialisation robuste du NavCube à faces indépendantes
  const navcubeContainer = document.getElementById('navcube');
  const navcubeCanvas = document.getElementById('navcube-canvas');

  if (navcubeContainer && navcubeCanvas) {
    const vcScene = new THREE.Scene();
    const vcCamera = new THREE.PerspectiveCamera(50, 1, 0.1, 10);
    vcCamera.position.set(0, 0, 2.8);

    const vcRenderer = new THREE.WebGLRenderer({ canvas: navcubeCanvas, antialias: true, alpha: true });
    vcRenderer.setSize(110, 110);
    vcRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    function createFaceTexture(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#1b222c';
      ctx.fillRect(0, 0, 128, 128);
      ctx.strokeStyle = '#ffb700';
      ctx.lineWidth = 6;
      ctx.strokeRect(3, 3, 122, 122);
      ctx.fillStyle = '#f0f2f5';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 64, 64);
      return new THREE.CanvasTexture(canvas);
    }

    const faceConfigs = [
      { name: 'Droite', pos: [0.55, 0, 0], rot: [0, Math.PI / 2, 0] },
      { name: 'Gauche', pos: [-0.55, 0, 0], rot: [0, -Math.PI / 2, 0] },
      { name: 'Dessus', pos: [0, 0.55, 0], rot: [-Math.PI / 2, 0, 0] },
      { name: 'Dessous', pos: [0, -0.55, 0], rot: [Math.PI / 2, 0, 0] },
      { name: 'Avant', pos: [0, 0, 0.55], rot: [0, 0, 0] },
      { name: 'Arrière', pos: [0, 0, -0.55], rot: [0, Math.PI, 0] }
    ];

    const vcGroup = new THREE.Group();
    vcScene.add(vcGroup);

    const planeGeo = new THREE.PlaneGeometry(1.1, 1.1);
    const interactiveFaces = [];

    faceConfigs.forEach(cfg => {
      const mat = new THREE.MeshBasicMaterial({ map: createFaceTexture(cfg.name), side: THREE.DoubleSide });
      const mesh = new THREE.Mesh(planeGeo, mat);
      mesh.position.set(...cfg.pos);
      mesh.rotation.set(...cfg.rot);
      mesh.userData = { faceName: cfg.name };
      vcGroup.add(mesh);
      interactiveFaces.push(mesh);
    });

    const boxGeo = new THREE.BoxGeometry(1.1, 1.1, 1.1);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(boxGeo), new THREE.LineBasicMaterial({ color: 0xffb700 }));
    vcGroup.add(edges);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isDragging = false;
    let hasMoved = false;
    let startMouse = { x: 0, y: 0 };

    navcubeContainer.addEventListener('pointerdown', (e) => {
      isDragging = true;
      hasMoved = false;
      startMouse = { x: e.clientX, y: e.clientY };
      navcubeContainer.setPointerCapture(e.pointerId);
    });

    navcubeContainer.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      if (Math.hypot(e.clientX - startMouse.x, e.clientY - startMouse.y) > 3) {
        hasMoved = true;
      }
    });

    navcubeContainer.addEventListener('pointerup', (e) => {
      isDragging = false;
      navcubeContainer.releasePointerCapture(e.pointerId);

      if (hasMoved) return;

      const rect = navcubeContainer.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, vcCamera);
      const hits = raycaster.intersectObjects(interactiveFaces);

      if (hits.length > 0) {
        const faceName = hits[0].object.userData.faceName;
        if (window.alignCameraToFace) {
          window.alignCameraToFace(faceName);
        } else {
          console.log("Face cliquée :", faceName);
        }
      }
    });

    // Fonction globale pour synchroniser l'orientation du cube avec la caméra principale dans ton main.js
    window.updateNavCube = function(mainCamera) {
      if (vcGroup && mainCamera) {
        vcGroup.quaternion.copy(mainCamera.quaternion).invert();
        vcRenderer.render(vcScene, vcCamera);
      }
    };
  }
</script>

<script type="module" src="js/main.js"></script>
</body>
</html>
