<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualiseur OpenDrone - Local</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0b0f;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
        }
        .tab-btn {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .tab-btn:hover, .tab-btn.active {
            background-color: #ffb700;
            color: #000;
            border-color: #ffb700;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 1.1rem;
            pointer-events: none;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <!-- Pointe vers le dossier models situé dans public -->
        <button class="tab-btn active" onclick="loadDroneModel('models/frame3.glb')">3" Freestyle</button>
        <button class="tab-btn" onclick="loadDroneModel('models/frame5.glb')">5" Freestyle</button>
    </div>

    <div id="loading">Chargement des composants GLB...</div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('canvas-container');
        const loadingElement = document.getElementById('loading');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0f);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 80, 150);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(60, 100, 60);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0x7799ff, 1.0);
        fillLight.position.set(-60, 40, -60);
        scene.add(fillLight);

        let currentModel = null;
        const loader = new GLTFLoader();

        window.loadDroneModel = function(filePath) {
            loadingElement.style.display = 'block';
            loadingElement.innerText = "Chargement du modèle 3D...";

            if (currentModel) {
                scene.remove(currentModel);
                currentModel = null;
            }

            loader.load(
                filePath,
                (gltf) => {
                    currentModel = gltf.scene;

                    currentModel.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                        }
                    });

                    scene.add(currentModel);

                    const box = new THREE.Box3().setFromObject(currentModel);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());

                    currentModel.position.sub(center);

                    const maxDim = Math.max(size.x, size.y, size.z);
                    camera.position.set(maxDim * 1.8, maxDim * 1.2, maxDim * 2.2);
                    controls.target.set(0, 0, 0);
                    controls.update();

                    loadingElement.style.display = 'none';
                },
                (xhr) => {
                    if (xhr.total) {
                        const percent = Math.round((xhr.loaded / xhr.total) * 100);
                        loadingElement.innerText = `Chargement : ${percent}%`;
                    }
                },
                (error) => {
                    console.warn("Erreur de chargement du GLB :", error);
                    loadingElement.innerText = "Erreur : Fichier GLB introuvable.";
                }
            );
        };

        // Chargement initial pointant vers le dossier models de public
        loadDroneModel('models/frame3.glb');

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
            });
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
